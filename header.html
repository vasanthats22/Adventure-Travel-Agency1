<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Adventure Travel Agency - Navbar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
    }

    body {
      padding-top: 110px;
      background: #f5f2ea;
    }

    /* ===== NAVBAR — WILDERNESS TRAIL ===== */
    .navbar {
      background: #1f3d2b;                       /* deep forest green */
      box-shadow: 0 6px 28px rgba(15, 30, 22, 0.5);
      border-bottom: 3px solid #d98e3f;          /* campfire amber */
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      width: 100%;
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 110px;
      gap: 20px;
      width: 100%;
    }

    /* ===== LOGO (image only, no span) ===== */
    .logo-section {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.25s ease;
    }

    .logo-section:hover {
      opacity: 0.88;
    }

    .logo-img {
      height: 70px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* ===== NAV LINKS ===== */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 26px;
      flex: 1;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .nav-link {
      background: none;
      border: none;
      padding: 0 0 4px 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: #d4cfc0;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      white-space: nowrap;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-bottom: 2px solid transparent;
      text-decoration: none;
    }

    .nav-link i {
      color: #a8b89a;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    .nav-link:hover {
      color: #ffffff;
      border-bottom-color: #d98e3f;
      transform: translateY(-2px);
    }

    .nav-link:hover i {
      color: #e8a558;
    }

    /* ===== RIGHT ACTIONS ===== */
    .right-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .action-link {
      background: transparent;
      border: 1.5px solid #4a6b52;
      padding: 0.55rem 1.5rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      color: #d4cfc0;
      cursor: pointer;
      transition: all 0.3s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      text-decoration: none;
    }

    .action-link i {
      color: #a8b89a;
      font-size: 1rem;
    }

    .action-link.login-link {
      background: #d98e3f;
      border: 1.5px solid #d98e3f;
      color: #1f3d2b;
      font-weight: 700;
    }

    .action-link.login-link i {
      color: #1f3d2b;
    }

    .action-link:hover {
      background: #4a6b52;
      border-color: #6b8f73;
      color: #ffffff;
      transform: scale(1.04);
    }

    .action-link:hover i {
      color: #e8a558;
    }

    .action-link.login-link:hover {
      background: #e8a558;
      border-color: #e8a558;
      color: #1f3d2b;
    }

    .action-link.login-link:hover i {
      color: #1f3d2b;
    }

    /* ===== HAMBURGER ===== */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 6px;
      padding: 8px;
      background: transparent;
      border: none;
      z-index: 1001;
    }

    .hamburger span {
      width: 28px;
      height: 2.5px;
      background: #d4cfc0;
      border-radius: 4px;
      transition: all 0.3s ease;
    }

    .hamburger:hover span {
      background: #d98e3f;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(8px, 8px);
      background: #d98e3f;
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }

    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(7px, -7px);
      background: #d98e3f;
    }

    /* ===== MOBILE MENU ===== */
    .mobile-menu {
      position: fixed;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100vh;
      background: #1f3d2b;
      z-index: 999;
      transition: left 0.4s ease-in-out;
      overflow-y: auto;
      padding-top: 130px;
      border-right: 4px solid #d98e3f;
    }

    .mobile-menu.active {
      left: 0;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      padding: 20px 30px;
      gap: 10px;
    }

    .mobile-nav-link {
      background: none;
      border: none;
      padding: 14px 0;
      font-size: 1.2rem;
      font-weight: 600;
      color: #d4cfc0;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: left;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid rgba(212, 207, 192, 0.08);
      width: 100%;
      text-decoration: none;
    }

    .mobile-nav-link i {
      width: 32px;
      color: #a8b89a;
      font-size: 1.2rem;
      transition: 0.2s;
    }

    .mobile-nav-link:hover {
      color: #ffffff;
      transform: translateX(8px);
    }

    .mobile-nav-link:hover i {
      color: #e8a558;
    }

    .mobile-actions {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 24px 30px;
      margin-top: 20px;
      border-top: 1px solid rgba(212, 207, 192, 0.08);
    }

    .mobile-action-link {
      background: transparent;
      border: 1.5px solid #4a6b52;
      padding: 14px 0;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #d4cfc0;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      text-decoration: none;
    }

    .mobile-action-link i {
      color: #a8b89a;
      font-size: 1.1rem;
      transition: 0.2s;
    }

    .mobile-action-link.login-mobile {
      background: #d98e3f;
      border-color: #d98e3f;
      color: #1f3d2b;
      font-weight: 700;
    }

    .mobile-action-link.login-mobile i {
      color: #1f3d2b;
    }

    .mobile-action-link:hover {
      background: #4a6b52;
      border-color: #6b8f73;
      color: #ffffff;
    }

    .mobile-action-link:hover i {
      color: #e8a558;
    }

    .mobile-action-link.login-mobile:hover {
      background: #e8a558;
      border-color: #e8a558;
      color: #1f3d2b;
    }

    .mobile-action-link.login-mobile:hover i {
      color: #1f3d2b;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 1024px) {
      .nav-links { gap: 16px; }
      .nav-link { font-size: 0.85rem; }
      .nav-link i { font-size: 0.85rem; }
    }

    @media (max-width: 900px) {
      .nav-link span { display: none; }
      .nav-link { font-size: 1.2rem; gap: 0; }
      .nav-link i { font-size: 1.2rem; }
    }

    @media (max-width: 768px) {
      body { padding-top: 95px; }
      .nav-container { padding: 0 20px; height: 95px; }
      .nav-links { display: none; }
      .right-actions { display: none; }
      .hamburger { display: flex; }
      .logo-img { height: 75px; }
      .mobile-menu { padding-top: 110px; }
    }

    @media (max-width: 480px) {
      body { padding-top: 85px; }
      .nav-container { height: 85px; padding: 0 16px; }
      .logo-img { height: 70px; }
      .mobile-nav-link { font-size: 1rem; padding: 12px 0; }
      .mobile-nav-link i { font-size: 1rem; width: 28px; }
      .mobile-action-link { font-size: 1rem; padding: 12px 0; }
      .mobile-menu { padding-top: 100px; }
    }
  </style>
</head>
<body>

  <!-- ====== NAVBAR ====== -->
  <nav class="navbar">
    <div class="nav-container">

      <!-- LOGO → index.html (image only) -->
      <a href="index.html" class="logo-section">
        <img src="Stacklylogo3.webp" alt="Stackly Adventure Travel" class="logo-img" />
      </a>

      <!-- 6 CENTER NAV LINKS — adventure travel themed -->
      <div class="nav-links">
        <a href="index.html" class="nav-link"><i class="fas fa-mountain"></i> <span>Home</span></a>
        <a href="destinations.html" class="nav-link"><i class="fas fa-map-marked-alt"></i> <span>Destinations</span></a>
        <a href="adventures.html" class="nav-link"><i class="fas fa-compass"></i> <span>Adventures</span></a>
        <a href="tours.html" class="nav-link"><i class="fas fa-route"></i> <span>Tours</span></a>
        <a href="guides.html" class="nav-link"><i class="fas fa-user-tie"></i> <span>Guides</span></a>
        <a href="contact.html" class="nav-link"><i class="fas fa-paper-plane"></i> <span>Contact</span></a>
      </div>

      <!-- RIGHT: 2 buttons -->
      <div class="right-actions">
        <a href="signup.html" class="action-link"><i class="fas fa-user-plus"></i> Register</a>
        <a href="login.html" class="action-link login-link"><i class="fas fa-sign-in-alt"></i> Login</a>
      </div>

      <!-- HAMBURGER -->
      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </nav>

  <!-- ====== MOBILE MENU ====== -->
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav-links">
      <a href="index.html" class="mobile-nav-link"><i class="fas fa-mountain"></i> Home</a>
      <a href="destinations.html" class="mobile-nav-link"><i class="fas fa-map-marked-alt"></i> Destinations</a>
      <a href="adventures.html" class="mobile-nav-link"><i class="fas fa-compass"></i> Adventures</a>
      <a href="tours.html" class="mobile-nav-link"><i class="fas fa-route"></i> Tours</a>
      <a href="guides.html" class="mobile-nav-link"><i class="fas fa-user-tie"></i> Guides</a>
      <a href="contact.html" class="mobile-nav-link"><i class="fas fa-paper-plane"></i> Contact</a>
    </div>

    <div class="mobile-actions">
      <a href="signup.html" class="mobile-action-link"><i class="fas fa-user-plus"></i> Register</a>
      <a href="login.html" class="mobile-action-link login-mobile"><i class="fas fa-sign-in-alt"></i> Login</a>
    </div>
  </div>

  <!-- ====== JAVASCRIPT ====== -->
  <script>
    (function() {
      const hamburgerBtn = document.getElementById('hamburgerBtn');
      const mobileMenu = document.getElementById('mobileMenu');

      function toggleMobileMenu() {
        hamburgerBtn.classList.toggle('active');
        mobileMenu.classList.toggle('active');
        document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
      }

      function closeMobileMenu() {
        hamburgerBtn.classList.remove('active');
        mobileMenu.classList.remove('active');
        document.body.style.overflow = '';
      }

      hamburgerBtn.addEventListener('click', toggleMobileMenu);

      document.querySelectorAll('.mobile-nav-link, .mobile-action-link').forEach(link => {
        link.addEventListener('click', closeMobileMenu);
      });

      document.addEventListener('click', function(e) {
        if (mobileMenu.classList.contains('active')) {
          if (!hamburgerBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
            closeMobileMenu();
          }
        }
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 768) closeMobileMenu();
      });

      window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeMobileMenu();
      });
    })();
  </script>

</body>
</html>
